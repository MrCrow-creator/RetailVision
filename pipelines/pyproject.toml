[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "retailvision-pipelines"
version = "0.2.2"
description = "Offline Open Food Facts ingestion for RetailVision"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28,<1",
    "pydantic-settings>=2.10,<3",
    "Pillow>=12.0,<13",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9", "ruff>=0.12,<1"]

[tool.setuptools.packages.find]
include = ["ingestion*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
